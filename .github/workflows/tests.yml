name: Tests

on: ["push", "pull_request"]

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: ["8.3"]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - os: ubuntu-latest
            php: "8.6"
            dependency-version: prefer-stable

    name: Tests P${{ matrix.php }} - ${{ matrix.os }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: dependencies-php-${{ matrix.php }}-os-${{ matrix.os }}-version-${{ matrix.dependency-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: dependencies-php-${{ matrix.php }}-os-${{ matrix.os }}-version-${{ matrix.dependency-version }}-composer-

      - name: Use Laravel 13 tooling on PHP 8.6
        if: matrix.php == '8.6'
        run: >-
          composer require --dev --no-update --no-interaction
          "laravel/framework:~13.44" "orchestra/testbench:~11.0"
          "pestphp/pest:~5.3" "pestphp/pest-plugin-type-coverage:~5.1"
          "phpstan/phpstan:~2.3" "rector/rector:~2.0"

      - name: Install Composer dependencies
        run: composer update --${{ matrix.dependency-version }} --no-interaction --prefer-dist

      - name: Integration Tests
        run: php ./vendor/bin/pest
